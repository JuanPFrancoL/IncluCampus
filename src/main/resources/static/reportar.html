<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IncluCampus - Resultado de la ruta</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<a class="salto" href="#contenido">Saltar al contenido</a>

<header class="cabecera">
    <div class="cabecera__fila">
        <a class="marca" href="index.html">IncluCampus</a>

        <nav aria-label="Principal">
            <ul class="menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="reportar.html">Reportar bloqueo</a></li>
                <li><a href="bloqueos.html">Bloqueos activos</a></li>
                <li><a href="login.html">Iniciar sesión</a></li>
            </ul>
        </nav>
    </div>
</header>
<main id="contenido" tabindex="-1">
    <section class="tarjeta" aria-labelledby="titulo-reporte">
        <h1 id="titulo-reporte">Reportar bloqueo</h1>

        <form id="form-bloqueo" novalidate>
            <div class="campo">
                <label for="camino">Punto bloqueado (obligatorio)</label>
                <select id="camino" name="camino" required aria-describedby="mensaje"></select>
            </div>

            <div class="campo">
                <label for="motivo">Motivo (obligatorio)</label>
                <select id="motivo" name="motivo" required aria-describedby="mensaje">
                    <option value="">Elige un motivo</option>
                    <option value="OBRAS">Obras</option>
                    <option value="EVENTO">Evento en el campus</option>
                    <option value="ASCENSOR">Ascensor fuera de servicio</option>
                    <option value="OTRO">Otro</option>
                </select>
            </div>

            <div class="campo">
                <label for="detalle">Detalle (opcional)</label>
                <textarea id="detalle" name="detalle" rows="4" maxlength="250"></textarea>
            </div>

            <button type="submit" class="boton">Reportar bloqueo</button>
        </form>

        <p id="mensaje" class="mensaje" role="status"></p>
    </section>
</main>
<div class="accesibilidad-flotante">
    <div id="menu-accesibilidad" class="accesibilidad-menu" role="region" aria-label="Opciones de accesibilidad" hidden>
        <button type="button" id="btn-letra" aria-pressed="false">Letra grande</button>
        <button type="button" id="btn-contraste" aria-pressed="false">Alto contraste</button>
    </div>

    <button type="button"
            id="btn-accesibilidad-toggle"
            class="accesibilidad-boton"
            aria-expanded="false"
            aria-controls="menu-accesibilidad"
            aria-label="Abrir opciones de accesibilidad">
        <!-- Ícono universal de accesibilidad -->
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="currentColor">
            <circle cx="12" cy="5.2" r="2.1"/>
            <path d="M5 9.2h14v2.1h-4.8v9.7h-2.2v-5.5h-2v5.5H7.8v-9.7H5V9.2z"/>
        </svg>
    </button>
</div>
<div class="indicador-pagina" aria-hidden="true">
    <span class="indicador-pagina__etiqueta">Estás en:</span>
    <span id="nombre-pagina-actual" class="indicador-pagina__valor">Inicio</span>
</div>

<script src="js/accesibilidad.js"></script>
<script src="js/rutas-datos.js"></script>
<script src="js/reportar.js"></script>
</body>
</html>
